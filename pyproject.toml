[project]
name = "aalcr_experiments"
version = "0.1.0"
requires-python = ">=3.10"
description = "Publication-quality codebase for AALCR++ experiments"
readme = "README.md"
authors = [ { name = "Researcher" } ]

[project.dependencies]
torch = "~=2.1"
torchvision = "~=0.16"
hydra-core = "^1.3"
wandb = "^0.16"
optuna = "^3.5"
matplotlib = "^3.8"
seaborn = "^0.13"
scikit-learn = "^1.3"
scipy = "^1.11"
pandas = "^2.1"
Pillow = "^10.0"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
